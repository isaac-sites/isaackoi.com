<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Isaac Koi UFO Research Map</title>
    <script>
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem("phoenix-color-mode"); } catch (error) {}
        var theme = stored === "dark" || stored === "light"
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      }());
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
    <link rel="stylesheet" href="styles.css?v=17">
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel" aria-label="Map controls">
        <div class="control-bar">
          <div class="brand">
            <a class="brand-lockup" href="https://isaackoi.com/" aria-label="Isaac Koi Archive home">
              <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <g stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
                    <path d="M64 20V34M64 34L44 50M64 34L84 50M44 50L28 66M44 50L52 66M84 50L76 66M84 50L100 66"/>
                  </g>
                  <rect x="60" y="66" width="8" height="24" fill="var(--accent)"/>
                  <path d="M64 90C50.8 82.8 27.9 82.8 15 90V105C29.4 98.6 50.3 98.6 64 105C77.7 98.6 98.6 98.6 113 105V90C100.1 82.8 77.2 82.8 64 90Z" fill="var(--accent)"/>
                  <path d="M64 10L74 20L64 30L54 20L64 10ZM44 42L52 50L44 58L36 50L44 42ZM84 42L92 50L84 58L76 50L84 42Z" fill="currentColor"/>
                </svg>
              </span>
              <span class="brand-copy">
                <span class="brand-name">Isaac Koi Archive</span>
                <span class="brand-title">UFO Research Map</span>
                <span class="brand-tagline">Documents, catalogue records, and linked archive sources</span>
              </span>
            </a>
          </div>

          <div class="stats" aria-live="polite">
            <div>
              <span id="visibleCount">0</span>
              <label>visible</label>
            </div>
            <div>
              <span id="totalCount">0</span>
              <label>total</label>
            </div>
          </div>

          <label class="field search-field">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Location, date, state, record ID">
          </label>

          <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="advancedFilters">
            Filters <span id="activeFilterCount" class="filter-count" hidden>0</span>
          </button>

          <button id="resetButton" class="reset" type="button">Reset</button>

          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme" title="Switch colour theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3a8.8 8.8 0 1 0 6.5 14.7 9.2 9.2 0 0 1-6.5-14.7z"/></svg>
          </button>
        </div>

        <div id="advancedFilters" class="advanced-filters" hidden>
          <fieldset class="layer-controls">
            <legend>Layers</legend>
            <label><input id="fold3LayerToggle" type="checkbox" checked> Documents / Project Blue Book / Fold3</label>
            <label><input id="aproLayerToggle" type="checkbox" checked> Publications / records with linked archive evidence</label>
          </fieldset>

          <fieldset class="archive-tree-field">
            <legend>Publication and document layers</legend>
            <div id="archiveTree" class="archive-tree" aria-label="Archive source filter"></div>
            <p class="filter-help">Tick a publication or document collection to show only records linked to that part of the Isaac Koi archive.</p>
          </fieldset>

          <label class="field">
            <span>Country</span>
            <select id="countryFilter">
              <option value="">All countries/areas</option>
            </select>
          </label>

          <label class="field">
            <span>State</span>
            <select id="stateFilter">
              <option value="">All states</option>
            </select>
          </label>

          <label class="field">
            <span>Year</span>
            <select id="yearFilter">
              <option value="">All years</option>
            </select>
          </label>

          <label class="field">
            <span>Month</span>
            <select id="monthFilter">
              <option value="">All months</option>
            </select>
          </label>

          <label class="field">
            <span>Decade</span>
            <select id="decadeFilter">
              <option value="">All decades</option>
            </select>
          </label>

          <div class="field">
            <span>Color</span>
            <div class="segmented" role="group" aria-label="Marker color mode">
              <button id="colorByDecade" class="active" type="button">Decade</button>
              <button id="colorByState" type="button">State</button>
            </div>
          </div>
        </div>
      </aside>

      <section class="map-panel" aria-label="Interactive map">
        <div id="map"></div>
        <div id="popup" class="ol-popup">
          <button id="popupClose" class="popup-close" type="button" aria-label="Close popup">x</button>
          <div id="popupContent"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script src="app.js?v=33"></script>
  </body>
</html>
