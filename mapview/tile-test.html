<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet Tile Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQh97EnnmdrjHLQkK7S6kU0YrT2T9q8=" crossorigin="">
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .control {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        display: flex;
        gap: 8px;
        padding: 8px;
        background: #fff;
        border: 1px solid #cfd6df;
        border-radius: 8px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
        font-family: Arial, Helvetica, sans-serif;
      }

      .leaflet-tile {
        outline: 1px solid rgba(195, 85, 42, 0.45);
      }

      button {
        min-height: 34px;
        border: 1px solid #cfd6df;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="control">
      <button type="button" id="carto">CARTO</button>
      <button type="button" id="osm">OSM</button>
      <button type="button" id="reload">Redraw</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      L.Browser.any3d = false;
      L.Browser.webkit3d = false;
      L.Browser.ie3d = false;
      L.Browser.gecko3d = false;
      L.Browser.opera3d = false;

      const map = L.map("map", {
        center: [39.5, -98.35],
        zoom: 4,
        zoomAnimation: false,
        fadeAnimation: false,
      });

      const layers = {
        carto: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", {
          maxZoom: 18,
          subdomains: "abcd",
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        }),
        osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }),
      };

      let current = layers.carto.addTo(map);
      let loaded = 0;
      let failed = 0;
      const status = L.control({ position: "bottomleft" });
      status.onAdd = function () {
        this._div = L.DomUtil.create("div", "control");
        this._div.style.left = "12px";
        this._div.style.top = "auto";
        this._div.style.bottom = "12px";
        this.update();
        return this._div;
      };
      status.update = function () {
        this._div.innerHTML = `<strong>Leaflet tiles:</strong> ${loaded} loaded, ${failed} failed`;
      };
      status.addTo(map);

      function attachCounters(layer) {
        loaded = 0;
        failed = 0;
        status.update();
        layer.on("tileload", () => {
          loaded += 1;
          status.update();
        });
        layer.on("tileerror", () => {
          failed += 1;
          status.update();
        });
      }
      attachCounters(current);

      function switchLayer(name) {
        map.removeLayer(current);
        current = layers[name].addTo(map);
        attachCounters(current);
        setTimeout(() => {
          map.invalidateSize({ pan: false });
          current.redraw();
        }, 100);
      }

      document.getElementById("carto").addEventListener("click", () => switchLayer("carto"));
      document.getElementById("osm").addEventListener("click", () => switchLayer("osm"));
      document.getElementById("reload").addEventListener("click", () => {
        map.invalidateSize({ pan: false });
        current.redraw();
      });

      setTimeout(() => map.invalidateSize({ pan: false }), 100);
      setTimeout(() => map.invalidateSize({ pan: false }), 600);
    </script>
  </body>
</html>
