<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenLayers Tile Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .control {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        padding: 8px;
        background: #fff;
        border: 1px solid #cfd6df;
        border-radius: 8px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
        font-family: Arial, Helvetica, sans-serif;
      }

      button {
        min-height: 34px;
        border: 1px solid #cfd6df;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="control">
      <button type="button" id="carto">CARTO</button>
      <button type="button" id="osm">OSM</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script>
      const carto = new ol.layer.Tile({
        source: new ol.source.XYZ({
          url: "https://{a-d}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
          attributions:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        }),
      });

      const osm = new ol.layer.Tile({
        visible: false,
        source: new ol.source.OSM(),
      });

      const map = new ol.Map({
        target: "map",
        layers: [carto, osm],
        view: new ol.View({
          center: ol.proj.fromLonLat([-98.35, 39.5]),
          zoom: 4,
        }),
      });

      document.getElementById("carto").addEventListener("click", () => {
        carto.setVisible(true);
        osm.setVisible(false);
      });
      document.getElementById("osm").addEventListener("click", () => {
        carto.setVisible(false);
        osm.setVisible(true);
      });
    </script>
  </body>
</html>
